[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "incremental-cdc-databricks-pipeline"
version = "0.1.0"
description = "Production-Grade Incremental CDC Pipeline on Databricks using Delta Lake and Apache Spark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=3.5.0,<3.6.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-p no:cacheprovider"
